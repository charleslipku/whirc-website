# ── 站点全局配置（团队成员可直接编辑）──────────────────
title: "WHIRC — Women's Health Interdisciplinary Research Collaborative"
shortName: "WHIRC"
tagline: "Bridge Disciplines. Advance Research and Education. Elevate Women's Health."
description: >-
  The Women's Health Interdisciplinary Research Collaborative (WHIRC) at the
  University of Maryland fosters interdisciplinary research, educates future
  leaders, and informs policy and practice to advance women's health across
  the lifespan.
